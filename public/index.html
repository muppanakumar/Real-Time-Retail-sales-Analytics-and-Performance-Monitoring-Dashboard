<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RetailPulse — Login</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#6366f1" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📊</text></svg>">
  <link rel="stylesheet" href="css/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-logo">
        <div class="logo-icon">📊</div>
        <div class="logo-text">
          <h1>RetailPulse</h1>
          <p>KPI Executive Dashboard</p>
        </div>
      </div>

      <div class="auth-tabs">
        <button class="auth-tab active" id="tab-login" onclick="switchTab('login')">Sign In</button>
        <button class="auth-tab" id="tab-register" onclick="switchTab('register')">Register</button>
      </div>

      <div id="error-msg" class="error-msg"></div>

      <!-- Login Form -->
      <form id="login-form" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label>Username or Email</label>
          <input type="text" id="login-username" placeholder="admin or analyst" required autocomplete="username" />
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="login-password" placeholder="Enter your password" required autocomplete="current-password" />
        </div>
        <button type="submit" class="btn-primary" id="login-btn">Sign In</button>
      </form>

      <!-- Register Form -->
      <form id="register-form" style="display:none" onsubmit="handleRegister(event)">
        <div class="form-group">
          <label>Username</label>
          <input type="text" id="reg-username" placeholder="Choose a username" required autocomplete="username" />
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="reg-email" placeholder="your@email.com" required autocomplete="email" />
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="reg-password" placeholder="Min 6 characters" required autocomplete="new-password" />
        </div>
        <div class="form-group">
          <label>Role</label>
          <select id="reg-role">
            <option value="analyst">Analyst</option>
            <option value="manager">Manager</option>
          </select>
        </div>
        <button type="submit" class="btn-primary" id="register-btn">Create Account</button>
      </form>

      <div class="auth-demo">
        <strong>Demo Accounts:</strong><br/>
        Admin: <strong>admin</strong> / <strong>Admin@123</strong><br/>
        Analyst: <strong>analyst</strong> / <strong>Demo@123</strong>
      </div>
    </div>
  </div>

  <script>
    // Redirect if already logged in
    if (localStorage.getItem('rp_token')) window.location.href = 'dashboard.html';

    function switchTab(tab) {
      document.getElementById('login-form').style.display = tab === 'login' ? 'block' : 'none';
      document.getElementById('register-form').style.display = tab === 'register' ? 'block' : 'none';
      document.getElementById('tab-login').classList.toggle('active', tab === 'login');
      document.getElementById('tab-register').classList.toggle('active', tab === 'register');
      hideError();
    }

    function showError(msg) {
      const el = document.getElementById('error-msg');
      el.textContent = msg;
      el.style.display = 'block';
    }
    function hideError() { document.getElementById('error-msg').style.display = 'none'; }

    async function handleLogin(e) {
      e.preventDefault();
      hideError();
      const btn = document.getElementById('login-btn');
      btn.innerHTML = '<span class="loading-spinner"></span>';
      btn.disabled = true;

      const usernameInput = document.getElementById('login-username').value.trim();
      const passwordInput = document.getElementById('login-password').value.trim();

      try {
        let authSuccess = false;
        let token, user;

        // 1. Try Backend API first (Localhost / Vercel Serverless)
        try {
          const res = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: usernameInput, password: passwordInput })
          });

          if (res.ok) {
            const data = await res.json();
            token = data.token;
            user = data.user;
            authSuccess = true;
          } else if (res.status === 401) {
            const errData = await res.json().catch(() => ({}));
            throw new Error(errData.error || 'Invalid credentials');
          }
        } catch (networkErr) {
          if (networkErr.message === 'Invalid credentials') throw networkErr;
          console.warn('Backend unavailable, using client-side auth mode:', networkErr);
        }

        // 2. Client-Side Fallback Authentication (for GitHub Pages / Static Hosting)
        if (!authSuccess) {
          const validUsers = JSON.parse(localStorage.getItem('rp_registered_users') || '{}');
          validUsers['admin'] = { password: 'Admin@123', role: 'admin', email: 'admin@retailpulse.com' };
          validUsers['analyst'] = { password: 'Demo@123', role: 'analyst', email: 'analyst@retailpulse.com' };

          const matched = validUsers[usernameInput];
          if (matched && matched.password === passwordInput) {
            token = 'rp_token_' + Date.now();
            user = { id: 1, username: usernameInput, email: matched.email, role: matched.role };
            authSuccess = true;
          } else {
            throw new Error('Invalid credentials. Use admin / Admin@123 or analyst / Demo@123');
          }
        }

        localStorage.setItem('rp_token', token);
        localStorage.setItem('rp_user', JSON.stringify(user));
        window.location.href = 'dashboard.html';
      } catch (err) {
        showError(err.message);
        btn.innerHTML = 'Sign In';
        btn.disabled = false;
      }
    }

    async function handleRegister(e) {
      e.preventDefault();
      hideError();
      const btn = document.getElementById('register-btn');
      btn.innerHTML = '<span class="loading-spinner"></span>';
      btn.disabled = true;

      const username = document.getElementById('reg-username').value.trim();
      const email = document.getElementById('reg-email').value.trim();
      const password = document.getElementById('reg-password').value;
      const role = document.getElementById('reg-role').value;

      try {
        let registered = false;
        let token, user;

        try {
          const res = await fetch('/api/auth/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, email, password, role })
          });
          if (res.ok) {
            const data = await res.json();
            token = data.token;
            user = data.user;
            registered = true;
          }
        } catch (_) {}

        if (!registered) {
          const validUsers = JSON.parse(localStorage.getItem('rp_registered_users') || '{}');
          validUsers[username] = { password, role, email };
          localStorage.setItem('rp_registered_users', JSON.stringify(validUsers));
          token = 'rp_token_' + Date.now();
          user = { id: Date.now(), username, email, role };
        }

        localStorage.setItem('rp_token', token);
        localStorage.setItem('rp_user', JSON.stringify(user));
        window.location.href = 'dashboard.html';
      } catch (err) {
        showError(err.message);
        btn.innerHTML = 'Create Account';
        btn.disabled = false;
      }
    }

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  </script>
</body>
</html>
